name: build

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all packages regardless of version
        type: boolean
        default: false
      package:
        description: Rebuild only this package (regardless of version)
        type: string
        default: ''
  push:
    branches: [main]
    paths: [packages.txt, .github/workflows/build.yml]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
      count: ${{ steps.diff.outputs.count }}
    steps:
      - name: Setup
        run: |
          pacman -Syu --noconfirm git jq
          useradd -m builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: srcdest
          key: srcdest-${{ github.run_id }}
          restore-keys: srcdest-
      - name: Compute build matrix
        id: diff
        env:
          FORCE: ${{ inputs.force }}
          ONLY_PKG: ${{ inputs.package }}
        run: |
          set -euo pipefail
          export SRCDEST="$PWD/srcdest"
          mkdir -p "$SRCDEST" aur
          chown -R builder "$SRCDEST"

          curl -fsSL -o x86_64.db "https://github.com/$GITHUB_REPOSITORY/releases/download/repo-x86_64/zxcaur.db" || true
          curl -fsSL -o aarch64.db "https://github.com/$GITHUB_REPOSITORY/releases/download/repo-aarch64/zxcaur.db" || true

          db_ver() { # $1=arch $2=pkgname -> published version, empty if absent
            [ -f "$1.db" ] || return 0
            local re
            re=$(printf '%s' "$2" | sed 's/[.+]/\\&/g')
            tar -tf "$1.db" 2>/dev/null | sed -n "s|^${re}-\([^-]*-[^-]*\)/\$|\1|p"
          }

          srcinfo_ver() { # .SRCINFO on stdin -> [epoch:]pkgver-pkgrel
            awk -F' = ' '/^\tepoch/{e=$2":"} /^\tpkgver/{v=$2} /^\tpkgrel/{r=$2} END{printf "%s%s-%s", e, v, r}'
          }

          entries='[]'
          while IFS= read -r -u3 pkg || [ -n "$pkg" ]; do
            case "$pkg" in ''|'#'*) continue ;; esac
            if [ -n "$ONLY_PKG" ] && [ "$pkg" != "$ONLY_PKG" ]; then continue; fi

            git clone --depth=1 "https://aur.archlinux.org/$pkg.git" "aur/$pkg" </dev/null
            [ -f "aur/$pkg/PKGBUILD" ] || { echo "::error::$pkg: no such package on AUR"; exit 1; }
            chown -R builder "aur/$pkg"

            if grep -Eq '^[[:space:]]*pkgver[[:space:]]*\(\)' "aur/$pkg/PKGBUILD"; then
              # VCS package: fetch sources and run pkgver() to learn the live upstream version.
              # --noprepare keeps patching out of the check; drop it if a pkgver() ever needs prepare().
              (cd "aur/$pkg" && sudo -u builder env SRCDEST="$SRCDEST" makepkg -od --noprepare --skippgpcheck </dev/null >&2)
              srcinfo=$(cd "aur/$pkg" && sudo -u builder makepkg --printsrcinfo)
            else
              srcinfo=$(cat "aur/$pkg/.SRCINFO")
            fi
            ver=$(printf '%s\n' "$srcinfo" | srcinfo_ver)
            names=$(printf '%s\n' "$srcinfo" | sed -n 's/^pkgname = //p')
            arches=$(printf '%s\n' "$srcinfo" | sed -n 's/^\tarch = //p' | sort -u)

            if printf '%s\n' "$arches" | grep -qx any; then
              targets=any
            else
              targets=""
              printf '%s\n' "$arches" | grep -qx x86_64 && targets="x86_64"
              printf '%s\n' "$arches" | grep -qx aarch64 && targets="$targets aarch64"
              [ -n "$targets" ] || echo "::warning::$pkg supports neither x86_64 nor aarch64 (arch: $arches)"
            fi

            for t in $targets; do
              if [ "$t" = any ]; then dbs="x86_64 aarch64"; else dbs="$t"; fi
              need=0
              if [ "$FORCE" = true ] || [ -n "$ONLY_PKG" ]; then need=1; fi
              for d in $dbs; do
                for n in $names; do
                  have=$(db_ver "$d" "$n")
                  if [ -z "$have" ] || [ "$(vercmp "$ver" "$have")" -gt 0 ]; then need=1; fi
                done
              done
              if [ "$need" = 1 ]; then
                if [ "$t" = aarch64 ]; then runner=ubuntu-24.04-arm; image=menci/archlinuxarm:base-devel@sha256:bad7da18bd6d4766450075dc59157b6d7e24f50c00a8d2377b88d7d540f2b47d
                else runner=ubuntu-latest; image=archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d; fi
                echo "$pkg ($t) $ver: build"
                entries=$(printf '%s' "$entries" | jq -c --arg p "$pkg" --arg a "$t" --arg r "$runner" --arg i "$image" \
                  '. + [{pkg: $p, arch: $a, runner: $r, image: $i}]')
              else
                echo "$pkg ($t) $ver: up to date"
              fi
            done
          done 3< packages.txt

          echo "matrix=$(printf '%s' "$entries" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$entries" | jq length)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: ${{ matrix.pkg }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 330  # runner hard limit is 360; fail visibly before it
    steps:
      - name: Setup
        run: |
          set -eu
          # resolve already-published packages as dependencies, once the repo exists
          if curl -fsIL "https://github.com/$GITHUB_REPOSITORY/releases/download/repo-$(uname -m)/zxcaur.db" >/dev/null 2>&1; then
            printf '[zxcaur]\nSigLevel = Optional TrustAll\nServer = https://github.com/%s/releases/download/repo-$arch\n' "$GITHUB_REPOSITORY" >> /etc/pacman.conf
          fi
          # pacman's landlock sandbox can't apply inside docker; the official x86_64
          # image ships with it disabled, the ALARM image does not
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          # LTO-linking tdesktop-class packages OOMs the 16 GB runners; default to
          # no LTO (a PKGBUILD's explicit options=(lto) still overrides this)
          # TODO: try LTOFLAGS='-flto=1' instead (serial LTO link may fit in RAM)
          echo 'OPTIONS+=(!lto)' >> /etc/makepkg.conf
          pacman -Syu --noconfirm git github-cli
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: srcdest
          key: srcdest-${{ github.run_id }}-${{ matrix.pkg }}-${{ matrix.arch }}
          restore-keys: |
            srcdest-${{ github.run_id }}
            srcdest-
      - name: Build
        run: |
          set -euo pipefail
          export SRCDEST="$PWD/srcdest" PKGDEST="$PWD/pkgdest"
          mkdir -p "$SRCDEST" "$PKGDEST"
          git clone --depth=1 "https://aur.archlinux.org/${{ matrix.pkg }}.git" pkgbuild
          chown -R builder "$SRCDEST" "$PKGDEST" pkgbuild
          cd pkgbuild
          sudo -u builder env SRCDEST="$SRCDEST" PKGDEST="$PKGDEST" makepkg -s --noconfirm --skippgpcheck </dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.pkg }}-${{ matrix.arch }}
          path: pkgdest/*.pkg.tar.zst
          if-no-files-found: error
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(pkgdest/*.pkg.tar.zst)

          release_lock() { gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/$1" >/dev/null 2>&1 || true; }

          case "${{ matrix.arch }}" in
            any) arches="x86_64 aarch64" ;;
            *) arches="${{ matrix.arch }}" ;;
          esac

          for arch in $arches; do
            tag=repo-$arch
            lock=heads/locks/publish-$arch

            # atomic ref creation is the index mutex: at most one publisher per arch.
            # ponytail: takeover treats our wait as lock age; wrong only if the publish
            # queue is deeper than ~30 one-minute publishes, and a lost entry self-heals
            # on the next scheduled run
            waited=0
            until gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/$lock" -f sha="$GITHUB_SHA" >/dev/null 2>&1; do
              sleep 15
              waited=$((waited+15))
              if [ "$waited" -ge 1800 ]; then
                echo "::warning::taking over stale publish lock for $arch"
                release_lock "$lock"
              fi
            done
            trap "release_lock '$lock'" EXIT

            gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$tag" -R "$GITHUB_REPOSITORY" --latest=false \
                --title "pacman repo ($arch)" \
                --notes "Rolling pacman repository. Consume with pacman, not by hand."

            rm -rf repo && mkdir repo
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D repo \
              -p zxcaur.db.tar.gz -p zxcaur.files.tar.gz || true
            cp "${files[@]}" repo/
            (cd repo && repo-add zxcaur.db.tar.gz *.pkg.tar.zst)

            # delete release assets superseded by this publish (same pkgname, older version)
            assets=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            for f in "${files[@]}"; do
              b=$(basename "$f")
              name=${b%-*-*-*.pkg.tar.zst}
              re=$(printf '%s' "$name" | sed 's/[.+]/\\&/g')
              old=$(printf '%s\n' "$assets" \
                | grep -E "^${re}-[^-]+-[^-]+-[^-]+\.pkg\.tar\.zst$" \
                | grep -vxF "$b" || true)
              for o in $old; do gh release delete-asset "$tag" "$o" -R "$GITHUB_REPOSITORY" -y; done
            done

            # pacman fetches zxcaur.db / zxcaur.files: publish the archives under both names
            rm -f repo/zxcaur.db repo/zxcaur.files
            cp repo/zxcaur.db.tar.gz repo/zxcaur.db
            cp repo/zxcaur.files.tar.gz repo/zxcaur.files
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber \
              "${files[@]}" repo/zxcaur.db repo/zxcaur.db.tar.gz repo/zxcaur.files repo/zxcaur.files.tar.gz

            release_lock "$lock"
            trap - EXIT
          done

